<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SSIMS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <a class="skip" href="#content">Skip to content</a>
    <div class="shell">
      <aside class="sidebar" id="sidebar"></aside>
      <div class="shell-main">
        <header class="topbar">
          <button class="icon-btn menu-btn" type="button" id="menu-btn" aria-label="Open menu">
            <span></span>
          </button>
          <form class="search" id="search-form" role="search">
            <span class="search-icon" aria-hidden="true"></span>
            <input id="search-input" type="search" name="q" placeholder="Search students, records, or documents..." />
            <button class="visually-hidden" type="submit">Search</button>
          </form>
          <div class="topbar-right">
            <a class="bell" id="bell" href="#/messages" aria-label="Notifications">
              <span class="bell-badge" id="bell-badge" hidden>0</span>
            </a>
            <button class="user-chip" type="button" id="user-chip" aria-haspopup="true" aria-expanded="false">
              <span class="avatar avatar-sm" id="user-avatar"></span>
              <span id="user-name"></span>
            </button>
          </div>
        </header>
        <main id="content" class="content"></main>
        <footer class="app-footer">
          <span>© 2026 NACEST · SSIMS</span>
          <nav>
            <a href="#/settings">Privacy Policy</a>
            <a href="#/settings">Terms of Use</a>
            <a href="#/messages">Support</a>
          </nav>
        </footer>
      </div>
    </div>
    <div class="drawer" id="drawer" hidden>
      <div class="drawer-backdrop" id="drawer-backdrop"></div>
      <aside class="drawer-panel" id="drawer-panel"></aside>
    </div>
    <script src="js/store.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
