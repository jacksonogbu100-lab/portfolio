<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sign in · NACEST SSIMS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body class="page-public page-login">
    <a class="skip" href="#content">Skip to content</a>
    <main id="content" class="login-wrap">
      <section class="login-card">
        <a class="brand brand-center" href="index.html">
          <span class="brand-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M3 10 12 5l9 5-9 5-9-5Z" /><path d="M7 12.5V16c0 .5 2.2 2 5 2s5-1.5 5-2v-3.5" /></svg>
          </span>
          <span>
            <strong>SSIMS</strong>
            <small>NACEST · Secure Student Information Management System</small>
          </span>
        </a>
        <h1>Sign in</h1>
        <p class="muted">Use your NACEST email. Students only see their own records.</p>
        <div class="alert alert-danger" id="login-error" hidden></div>
        <form id="login-form">
          <label>
            Email
            <input type="email" name="email" autocomplete="username" required placeholder="famous@nacest.local" />
          </label>
          <label>
            Password
            <input type="password" name="password" autocomplete="current-password" required placeholder="ssims-dev" />
          </label>
          <button class="btn btn-primary btn-block" type="submit">Sign in</button>
        </form>
        <p class="hint">Demo password for every account: <code>ssims-dev</code></p>
        <ul class="hint-list">
          <li>Student: famous@nacest.local</li>
          <li>Registrar: registrar@nacest.local</li>
          <li>Admin: admin@nacest.local</li>
        </ul>
      </section>
    </main>
    <script src="js/store.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/login.js"></script>
  </body>
</html>
