<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AetherOps — AI Workflow Command Center</title>
    <meta
      name="description"
      content="Autonomous AI agent platform for planning tasks, orchestrating tools, and completing business workflows with limited human intervention."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Sora:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <div class="app" id="app">
      <aside class="sidebar" aria-label="Primary">
        <a class="brand" href="index.html">
          <span class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 32 32" fill="none">
              <path
                d="M16 3L28 10v12L16 29 4 22V10L16 3Z"
                stroke="currentColor"
                stroke-width="1.6"
              />
              <path
                d="M16 10v12M10 13.5l12 5M22 13.5l-12 5"
                stroke="currentColor"
                stroke-width="1.4"
                stroke-linecap="round"
              />
            </svg>
          </span>
          <span class="brand-text">
            <strong>AetherOps</strong>
            <small>Agent Platform</small>
          </span>
        </a>

        <nav class="nav" aria-label="Sections">
          <button class="nav-item active" data-view="overview" type="button">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10.5 12 4l8 6.5V20a1 1 0 0 1-1 1h-5v-6H10v6H5a1 1 0 0 1-1-1v-9.5Z"/></svg>
            Overview
          </button>
          <button class="nav-item" data-view="workflows" type="button">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h7v3H4V7Zm9 0h7v3h-7V7ZM4 14h7v3H4v-3Zm9 0h7v3h-7v-3Z"/></svg>
            Workflows
          </button>
          <button class="nav-item" data-view="agents" type="button">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a4 4 0 0 1 4 4v1h2a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-8a2 2 0 0 1 2-2h2V7a4 4 0 0 1 4-4Zm-2 5h4V7a2 2 0 1 0-4 0v1Zm-1 5a1.25 1.25 0 1 0 0 2.5A1.25 1.25 0 0 0 9 13Zm6 0a1.25 1.25 0 1 0 0 2.5A1.25 1.25 0 0 0 15 13Z"/></svg>
            Agents
          </button>
          <button class="nav-item" data-view="analytics" type="button">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19h16v2H4v-2Zm2-3V9h2v7H6Zm5 0V5h2v11h-2Zm5 0v-4h2v4h-2Z"/></svg>
            Analytics
          </button>
          <button class="nav-item" data-view="approvals" type="button">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 12.5 11.2 15 16 9.5l1.4 1.2-6.2 7.3L7.5 13.7 9 12.5ZM5 4h14a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2Z"/></svg>
            Approvals
            <span class="nav-badge" id="approval-count">2</span>
          </button>
          <button class="nav-item" data-view="settings" type="button">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 8.5a3.5 3.5 0 1 1 0 7 3.5 3.5 0 0 1 0-7Zm8.2 2.4-.9-.5.3-1a1 1 0 0 0-.2-1l-1.4-1.4a1 1 0 0 0-1-.2l-1 .3-.5-.9a1 1 0 0 0-.9-.6h-2a1 1 0 0 0-.9.6l-.5.9-1-.3a1 1 0 0 0-1 .2L7.3 7.4a1 1 0 0 0-.2 1l.3 1-.9.5a1 1 0 0 0-.6.9v2a1 1 0 0 0 .6.9l.9.5-.3 1a1 1 0 0 0 .2 1l1.4 1.4a1 1 0 0 0 1 .2l1-.3.5.9a1 1 0 0 0 .9.6h2a1 1 0 0 0 .9-.6l.5-.9 1 .3a1 1 0 0 0 1-.2l1.4-1.4a1 1 0 0 0 .2-1l-.3-1 .9-.5a1 1 0 0 0 .6-.9v-2a1 1 0 0 0-.6-.9Z"/></svg>
            Settings
          </button>
        </nav>

        <div class="sidebar-foot">
          <div class="status-pill">
            <span class="pulse" aria-hidden="true"></span>
            All systems operational
          </div>
          <div class="mobile-promo">
            <strong>ModelOps Mobile</strong>
            <p>Monitor workflows on the go.</p>
          </div>
        </div>
      </aside>

      <div class="main">
        <header class="topbar">
          <div>
            <p class="eyebrow">Autonomous AI Agent Platform</p>
            <h1 id="view-title">AI Workflow Command Center</h1>
          </div>
          <div class="topbar-actions">
            <label class="search">
              <span class="sr-only">Search workflows</span>
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m16.5 15.4 4 4-1.1 1.1-4-4A7 7 0 1 1 16.5 15.4ZM11 16.5a5.5 5.5 0 1 0 0-11 5.5 5.5 0 0 0 0 11Z"/></svg>
              <input type="search" placeholder="Search agents, runs, tools…" id="search-input" />
            </label>
            <button class="btn btn-ghost" type="button" id="btn-sim">Simulate run</button>
            <button class="btn btn-primary" type="button" id="btn-deploy-top">Deploy route</button>
          </div>
        </header>

        <main class="content" id="content">
          <!-- Overview populated by JS -->
        </main>
      </div>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <script src="js/app.js"></script>
  </body>
</html>
