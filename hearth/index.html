<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hearth — Real-time communities</title>
    <meta
      name="description"
      content="Hearth is a real-time community platform for instant messaging, voice and video calls, presence, notifications, and moderation while large communities run at the same time."
    />
    <meta name="theme-color" content="#111214" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23111214'/%3E%3Cpath d='M16 6c2 4 2 6 0 8 3-1 6 1 6 5a6 6 0 1 1-12 0c0-4 3-6 6-5-2-2-2-4 0-8z' fill='%23ff6b3d'/%3E%3C/svg%3E"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/styles.css?v=5" />
  </head>
  <body>
    <a class="skip" href="#stage">Skip to content</a>
    <div class="app" id="app">
      <aside class="rail" aria-label="Communities">
        <button class="brand" type="button" data-action="fleet" aria-label="All communities">
          <svg viewBox="0 0 32 32" aria-hidden="true">
            <path d="M16 5c2.2 4.4 2.2 6.6 0 8.8 3.4-1.1 6.6 1 6.6 5.4a6.6 6.6 0 1 1-13.2 0c0-4.4 3.2-6.5 6.6-5.4C13.8 11.6 13.8 9.4 16 5z" />
          </svg>
        </button>
        <div class="rail-rule" aria-hidden="true"></div>
        <div class="rail-list" id="rail-list"></div>
      </aside>

      <aside class="channels" id="channels" aria-label="Channels"></aside>

      <section class="stage" id="stage" tabindex="-1"></section>

      <aside class="panel" id="panel" aria-label="Details"></aside>

      <button class="scrim" type="button" data-action="close-overlay" aria-label="Close"></button>
    </div>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <script src="js/app.js?v=4"></script>
  </body>
</html>
