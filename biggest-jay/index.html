<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Biggest Jay</title>
    <meta
      name="description"
      content="Biggest Jay is a retail wallet for data, airtime, bills, recharge pins, and demo bank-transfer funding."
    />
    <meta name="theme-color" content="#142033" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,560;9..144,700&family=Outfit:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/styles.css?v=1" />
  </head>
  <body>
    <a class="skip" href="#view">Skip to content</a>
    <div id="gate"></div>
    <div id="shell" class="shell" hidden>
      <aside id="sidebar" class="sidebar"></aside>
      <button class="scrim" type="button" data-act="close-nav" hidden aria-label="Close menu"></button>
      <div class="workspace">
        <header class="topbar" id="topbar"></header>
        <main id="view" tabindex="-1"></main>
      </div>
    </div>
    <div id="modal" class="modal" hidden></div>
    <section id="chat" class="chat" hidden aria-label="Support chat"></section>
    <button class="fab" id="fab" type="button" data-act="toggle-chat" hidden>
      <span class="fab-mark" aria-hidden="true">BJ</span>
      Message us
    </button>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <script src="js/data.js?v=1"></script>
    <script src="js/store.js?v=2"></script>
    <script src="js/app.js?v=3"></script>
  </body>
</html>
